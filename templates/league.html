<!DOCTYPE html>
<html>
<head>
  <title>League Competitions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="league-main">
    <div class="navbar">
      <div class="icon">
        <h2 class="logo">FootyG</h2>
      </div>
      <div class="menu">
        <ul>
          <li><a href="/">HOME</a></li>
          <li><a href="/leagues">LEAGUES</a></li>
          <li><a href="#">TEAMS</a></li>
          <li><a href="#">PLAYERS</a></li>
          <li><a href="#">CONTACT</a></li>
        </ul>
      </div>
      <div class="search">
        <input class="srch" type="search" name="" placeholder="Search">
        <a href="#"><button class="btn">Search</button></a>
      </div>
    </div>          <!-- ← closes navbar -->
    <hr>
    <div class="league-content">
      <h1>All 9 Leagues</h1>
      <p class="league-par">Football's Biggest leagues - all in one place</p>
      <hr class="line">
    </div>

    <div class="leagues">
      <ul>
        {% for comp in comps %}
        <li>
          {% if comp['type'] == 'LEAGUE' %}
            <a href="/standings/{{ comp['code'] }}"> {{ comp['name'] }} </a>
          {% endif %}
        </li>
        {% endfor %}
      </ul>
    </div>

  </div>              <!-- ← closes league-main -->
</body>
</html>
